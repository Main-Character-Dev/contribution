version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Keep declarations aligned with the product's Node 24 runtime.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 removed the stable compiler API used by regression fixtures.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
