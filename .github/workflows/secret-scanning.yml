name: Secret scanning
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned free Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan introduced commits (full history on manual runs)
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Do not execute project code or accept scan suppressions from the PR.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-policy.toml"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            range="$HEAD_SHA"
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]] && git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"; then
              base="$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" "$HEAD_SHA")"
              range="$base..$HEAD_SHA"
            else
              range="$HEAD_SHA"
            fi
          else
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40,64}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40,64}$ ]]
            range="$BASE_SHA..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact=100 --no-banner \
            --config "$RUNNER_TEMP/gitleaks-policy.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaks-ignores" \
            --ignore-gitleaks-allow --log-opts="$range"
